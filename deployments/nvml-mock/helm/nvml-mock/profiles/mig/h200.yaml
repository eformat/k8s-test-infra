# MIG profile table: HGX H200 (141GB HBM3e)
#
# The board's MIG partition geometry, held apart from its profile so the
# profile stays readable. Resolved at load time via MOCK_MIG_PROFILES_CONFIG
# or as a sibling of the config path, and attached to
# device_defaults.mig.supported_profiles.

version: 1

# NVIDIA MIG user guide, Supported MIG Profiles (H200 141GB, SXM and NVL),
# VALIDATED against the real cluster (ibm-tmm ocp-j8fns-gpu-1, 8x H200,
# driver 580.126.20): nvidia-smi mig -lgip/-lgipp 2026-11-25. Profile ids
# (1g=19, +me=20, 1g.REV2=15, 2g=14, 3g=9, 4g=5, 7g=0), memory (16 GiB /
# 32.50 GiB / 69.75 GiB / 140.00 GiB), SM counts (16 / 26 / 32 / 60 / 64 /
# 132 — non-uniform, NOT slice-linear) and placements are the real
# driver's. nvml_profile binds each row to the NVML enum the mock keys on.
#
# Every row declares its full geometry. `slices` restates the width the
# nvml_profile enum already spans so load can reconcile the two rather
# than trust either. `placements` are in *memory units*, not compute
# slices: a 7-slice board has eight units, so a 1g row is seven starts of
# size 1 and the full-board row is one `{start: 0, size: 8}`.
# `compute_instances` is the row's `mig -lcip` listing, and its engine
# counts are NVML's Shared* fields, which repeat the GPU instance's.
#
# The REV suffixes name variants of one width rather than widths of their
# own: REV1 is the +me media extension, REV2 the double-memory profile
# (1g.35gb is 1g.18gb at two memory units). Both, and the rest of the
# schema, are described in docs/mig.md.
supported_profiles:
  - name: "1g.18gb"
    nvml_profile: "1_SLICE"
    slices: 1
    profile_id: 19
    instances: 7
    memory_mb: 16384
    multiprocessors: 16
    copy_engines: 1
    decoders: 1
    jpeg: 1
    placements:
      - {start: 0, size: 1}
      - {start: 1, size: 1}
      - {start: 2, size: 1}
      - {start: 3, size: 1}
      - {start: 4, size: 1}
      - {start: 5, size: 1}
      - {start: 6, size: 1}
    compute_instances:
      - nvml_profile: "1_SLICE"
        slices: 1
        instances: 1
        multiprocessors: 16
        shared_copy_engines: 1
        decoders: 1
        jpeg: 1
      - nvml_profile: "1_SLICE_REV1"
        slices: 1
        instances: 1
        multiprocessors: 16
        shared_copy_engines: 1
        decoders: 1
